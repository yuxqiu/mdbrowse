<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>markdown preview</title>
<link rel="stylesheet" href="/vendor/github-markdown.css">
<link rel="stylesheet" href="/vendor/highlight-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/vendor/highlight-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/vendor/katex.min.css">
<script>
(function () {
  var zoom = parseFloat(new URLSearchParams(location.search).get("zoom"));
  if (zoom > 0) {
    document.documentElement.style.zoom = zoom;
  }
})();
</script>
<style>
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  body { margin: 0; }
  @media (prefers-color-scheme: dark) { body { background: #0d1117; } }
  .markdown-body {
    box-sizing: border-box;
    max-width: 860px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }
  #vim-search-bar {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0.3rem 0.6rem;
    background: #1e1e1e;
    color: #eee;
    font-family: ui-monospace, monospace;
    font-size: 0.9rem;
  }
  #vim-search-bar.open { display: flex; }
  #vim-search-bar .prefix { margin-right: 0.3rem; }
  #vim-search-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: inherit;
    font: inherit;
  }
</style>
</head>
<body>
<article class="markdown-body" id="content"></article>
<div id="vim-search-bar"><span class="prefix">/</span><input id="vim-search-input" autocomplete="off" spellcheck="false"></div>
<script src="/vendor/markdown-it.bundle.js"></script>
<script src="/vendor/mousetrap.min.js"></script>
<script>
(function () {
  var LINE_HEIGHT = 60;
  var CHAR_WIDTH = 80;
  var PAGE_FRACTION = 0.9;

  // instant: small incremental steps (j/k/h/l) -- animating every single
  // one of these felt off, especially held down for continuous scrolling.
  function scrollByPx(dx, dy) {
    window.scrollBy(dx, dy);
  }

  // smooth: "jump" motions -- moving further, and only occasionally.
  function scrollBySmooth(dx, dy) {
    window.scrollBy({ left: dx, top: dy, behavior: "smooth" });
  }
  function scrollToSmooth(x, y) {
    window.scrollTo({ left: x, top: y, behavior: "smooth" });
  }

  // vertical: line, half page, full page, top/bottom
  Mousetrap.bind("j", function () { scrollByPx(0, LINE_HEIGHT); });
  Mousetrap.bind("k", function () { scrollByPx(0, -LINE_HEIGHT); });
  Mousetrap.bind("ctrl+e", function () { scrollByPx(0, LINE_HEIGHT); });
  Mousetrap.bind("ctrl+y", function () { scrollByPx(0, -LINE_HEIGHT); });
  Mousetrap.bind("ctrl+d", function (e) { e.preventDefault(); scrollBySmooth(0, window.innerHeight / 2); });
  Mousetrap.bind("ctrl+u", function (e) { e.preventDefault(); scrollBySmooth(0, -window.innerHeight / 2); });
  Mousetrap.bind(["ctrl+f", "space"], function (e) { e.preventDefault(); scrollBySmooth(0, window.innerHeight * PAGE_FRACTION); });
  Mousetrap.bind(["ctrl+b", "backspace"], function (e) { e.preventDefault(); scrollBySmooth(0, -window.innerHeight * PAGE_FRACTION); });
  Mousetrap.bind("g g", function () { scrollToSmooth(window.scrollX, 0); });
  // "shift+g" is unreliable for plain letters in Mousetrap (it forces
  // keydown-based detection, which normalizes the character to lowercase
  // regardless of shift); binding the literal produced character "G" uses
  // its keypress path instead, which is what actually reports shifted case.
  //
  // maxScrollHeight/maxScrollWidth: under the CSS zoom applied above,
  // document.body.scrollHeight measurably under-reports the page's true
  // height (verified: body and documentElement agree exactly with no zoom,
  // but diverge under it, with only documentElement staying correct) --
  // the standard robust fix for this body/documentElement disagreement is
  // to take the max of both, not to trust either alone.
  function maxScrollHeight() {
    return Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
  }
  function maxScrollWidth() {
    return Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
  }
  Mousetrap.bind("G", function () { scrollToSmooth(window.scrollX, maxScrollHeight()); });

  // horizontal: char, start/end of scrollable width
  Mousetrap.bind("h", function () { scrollByPx(-CHAR_WIDTH, 0); });
  Mousetrap.bind("l", function () { scrollByPx(CHAR_WIDTH, 0); });
  Mousetrap.bind("0", function () { scrollToSmooth(0, window.scrollY); });
  Mousetrap.bind("$", function () { scrollToSmooth(maxScrollWidth(), window.scrollY); });

  // search
  var searchBar = document.getElementById("vim-search-bar");
  var searchInput = document.getElementById("vim-search-input");
  var lastQuery = "";

  function find(query, backwards) {
    if (!query || !window.find) return;
    window.find(query, false, backwards, true, false, false, false);
  }

  function openSearch() {
    searchBar.classList.add("open");
    searchInput.value = "";
    searchInput.focus();
  }

  function closeSearch() {
    searchBar.classList.remove("open");
    searchInput.blur();
  }

  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      lastQuery = searchInput.value;
      closeSearch();
      find(lastQuery, false);
    } else if (e.key === "Escape") {
      closeSearch();
    }
    e.stopPropagation();
  });

  // Mousetrap ignores bindings while an <input> has focus, so these never
  // fire while typing in the search box above.
  Mousetrap.bind("/", function (e) { e.preventDefault(); openSearch(); });
  Mousetrap.bind("n", function () { find(lastQuery, false); });
  Mousetrap.bind("N", function () { find(lastQuery, true); }); // see the "G" comment above re: shift+letter
})();
</script>
<script>
(function () {
  var v = 0;
  var el = document.getElementById("content");
  var previousText = null;

  var bg = new URLSearchParams(location.search).get("bg");
  if (bg) {
    document.body.style.background = bg;
    // github-markdown.css sets --bgColor-default directly on .markdown-body
    // itself (not just :root), so it has to be overridden on this same
    // element -- setting it higher up the tree would just get shadowed.
    el.style.setProperty("--bgColor-default", bg);
  }

  function firstDiffLine(oldText, newText) {
    var oldLines = oldText.split("\n");
    var newLines = newText.split("\n");
    var i = 0;
    var minLen = Math.min(oldLines.length, newLines.length);
    while (i < minLen && oldLines[i] === newLines[i]) i++;
    return i;
  }

  function scrollToLine(line) {
    var blocks = el.querySelectorAll("[data-line]");
    var target = null;
    for (var i = 0; i < blocks.length; i++) {
      if (parseInt(blocks[i].getAttribute("data-line"), 10) > line) break;
      target = blocks[i];
    }
    if (target) {
      // explicit rect math instead of scrollIntoView({block:"center"}):
      // that centers on the target's own (possibly tall) bounding box via
      // browser-internal heuristics, which drift under the page zoom we
      // apply above. This centers the same point every time.
      var rect = target.getBoundingClientRect();
      var targetCenter = rect.top + rect.height / 2;
      var viewportCenter = window.innerHeight / 2;
      window.scrollBy({ top: targetCenter - viewportCenter, behavior: "smooth" });
    }
  }

  function renderMarkdown(text) {
    el.innerHTML = window.__terminalBrowserRenderMarkdown(text);
    if (previousText !== null) {
      scrollToLine(firstDiffLine(previousText, text));
    }
    previousText = text;
  }

  async function fetchContent() {
    var r = await fetch("/content");
    v = parseInt(r.headers.get("X-Preview-Version") || "0", 10);
    renderMarkdown(await r.text());
  }

  async function poll() {
    try {
      var r = await fetch("/wait?v=" + v);
      var nv = parseInt(await r.text(), 10);
      if (!isNaN(nv) && nv > v) {
        await fetchContent();
      }
    } catch (e) {}
    setTimeout(poll, 200);
  }

  fetchContent().then(poll);
})();
</script>
</body>
</html>
